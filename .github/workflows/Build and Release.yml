---
name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE_NAME: mortcal
  AWS_REGION: us-east-1
  RG_STG: mortcal-rg-stg
  ACA_APP_STG: mortcal-containerapp-stg
  RG_PROD: mortcal-rg-prod
  ACA_APP_PROD: mortcal-containerapp-prod

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------
  # Formatter and Linter (every push)
  # --------------------
  formatLintAndTest:
    name: Format, Lint and Test Code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit (all files)
        run: pre-commit run --all-files --verbose

      - name: Install Pytest and App Dependencies
        run: pip install pytest matplotlib flask

      - name: Unit test
        run: PYTHONPATH=. pytest tests/


  build:
    name: Build & Push Docker Image
    needs: formatLintAndTest
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set_tag.outputs.IMAGE_TAG }}

    steps:
      - uses: actions/checkout@v5

      - id: set_tag
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAG=${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - run: |
          docker build -t tiggy081/$IMAGE_NAME:${{ steps.set_tag.outputs.IMAGE_TAG }} .
          docker push tiggy081/$IMAGE_NAME:${{ steps.set_tag.outputs.IMAGE_TAG }}


  # --------------------
  # DEPLOY STG (AWS)
  # --------------------
  deploy-stg-aws:
    name: Deploy to STG (AWS)
    needs: build
    if: github.event_name == 'push'

    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/aws/ecs/task-def-stg.json
          container-name: mortcal-app
          image: tiggy081/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: mortcal-svc-stg
          cluster: mortcal-cluster-stg
          wait-for-service-stability: true

  # --------------------
  # DEPLOY PROD (AWS, manual approval)
  # --------------------
  deploy-prod-aws:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Deploy to PROD (AWS)
    needs: [deploy-stg-aws, build]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/aws/ecs/task-def-prod.json
          container-name: mortcal-app
          image: tiggy081/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: mortcal-svc-prod
          cluster: mortcal-cluster-prod
          wait-for-service-stability: true

  # --------------------
  # DEPLOY STG (Azure) - DORMANT
  # infra/azure/ still provisions this if reapplied. Flip `if: false` back to
  # `if: github.event_name == 'push'` to re-enable once Azure resources exist again.
  # --------------------
  deploy-stg-azure:
    name: Deploy to STG (Azure)
    needs: build
    if: false

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - run: |
          az containerapp update \
            --name $ACA_APP_STG \
            --resource-group $RG_STG \
            --image tiggy081/$IMAGE_NAME:${{ needs.build.outputs.image_tag }} \

  # --------------------
  # DEPLOY PROD (Azure, manual approval) - DORMANT
  # Flip `if: false` back to the original condition to re-enable.
  # --------------------
  deploy-prod-azure:
    if: false
    name: Deploy to PROD (Azure)
    needs: [deploy-stg-azure, build]
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - run: |
          az containerapp update \
            --name $ACA_APP_PROD \
            --resource-group $RG_PROD \
            --image tiggy081/$IMAGE_NAME:${{ needs.build.outputs.image_tag }} \
